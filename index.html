<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project GetNet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#5d6b78;--bd:#dbe2e8;--accent:#0f766e;--side:#fff}
:root[data-theme=dark]{--bg:#0e1419;--card:#162029;--tx:#e6edf2;--mu:#93a3b1;--bd:#263541;--side:#121b22}
@media(prefers-color-scheme:dark){:root[data-theme=system]{--bg:#0e1419;--card:#162029;--tx:#e6edf2;--mu:#93a3b1;--bd:#263541;--side:#121b22}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--side);border-bottom:1px solid var(--bd)}
header h1{font:700 19px/1 Georgia,"Times New Roman",serif;margin:0;cursor:pointer;letter-spacing:.2px}
.sp{flex:1}
.wrap{flex:1;display:flex;min-height:0}
nav{width:240px;overflow:auto;padding:12px;background:var(--side);border-right:1px solid var(--bd)}
nav h4{margin:14px 8px 4px;font-size:13px;color:var(--mu);font-weight:600}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--bg)}nav a.on{background:var(--accent);color:#fff}
main{flex:1;overflow:auto;padding:24px;max-width:100%}
.in{max-width:900px;margin:auto}
h2{font:700 28px/1.2 Georgia,serif;margin:0 0 6px}
.mu{color:var(--mu)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dz{border:2px dashed var(--bd);border-radius:12px;padding:28px;text-align:center;margin:18px 0;background:var(--card)}
.dz.over{border-color:var(--accent)}
.fl{list-style:none;padding:0;margin:0 0 12px}
.fl li{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.fl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl button{border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
.f input,.f select{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.f input[type=checkbox]{width:20px;height:20px}.f input[type=color]{padding:2px;height:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:12px 0 28px}
.card{padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.card:hover{border-color:var(--accent)}.card b{display:block}
.card small{color:var(--mu)}
#st{min-height:24px;margin:10px 0}#st.err{color:#c0392b}
.res{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.res>div{padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.res img,.res video{max-width:100%;max-height:260px;border-radius:6px;background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0/16px 16px}
.stage{display:flex;justify-content:center;margin:14px 0}
.stage canvas{max-width:100%;max-height:60vh;border-radius:8px;background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0/16px 16px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:-24px;z-index:3;background:var(--bg);padding:8px 0}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pg{position:relative;margin:0 auto 14px;box-shadow:0 2px 12px #0004;background:#fff;max-width:100%}
.pg canvas{display:block}.ov{position:absolute;inset:0;touch-action:none}
.ti{position:absolute;pointer-events:none}
#pgs[data-m=edit] .ti{pointer-events:auto;cursor:text}.ti:hover{outline:1px dashed var(--accent);background:#0f766e22}
#pgs[data-m=text] .ov{cursor:text}#pgs[data-m=erase] .ov,#pgs[data-m=hl] .ov,#pgs[data-m=img] .ov{cursor:crosshair}
.an{position:absolute}.an.text{min-width:20px;outline:1px dashed #0f766e88}
.an.text .tt{display:block;line-height:1.2;white-space:pre;outline:none;font-family:"DejaVu Sans",Arial,sans-serif}
.mv{position:absolute;left:-16px;top:0;cursor:move;color:#0f766e;user-select:none}
.an.erase{background:#fff;outline:1px dashed #888}.an.hl{background:#ffe600;opacity:.45}
.an.erase,.an.hl,.an.img{resize:both;overflow:hidden;cursor:move}.an img{width:100%;height:100%;pointer-events:none;display:block}
.dx{position:absolute;right:0;top:-18px;font-size:12px;cursor:pointer;background:#c0392b;color:#fff;padding:0 5px;border-radius:4px;display:none}
.an:hover .dx,.an:focus-within .dx{display:block}.an.erase .dx,.an.hl .dx,.an.img .dx{top:0}
.cw{position:relative;display:inline-block;overflow:hidden;touch-action:none;line-height:0;--hs:20px;max-width:100%}
.cw img{max-width:100%;max-height:65vh;display:block;user-select:none;-webkit-user-drag:none}
.cb{position:absolute;box-shadow:0 0 0 9999px #000a;border:2px solid #fff;cursor:move}.cb.e{border-radius:50%}
.hd{position:absolute;width:var(--hs);height:var(--hs);margin:calc(var(--hs)/-2) 0 0 calc(var(--hs)/-2);background:var(--accent);border:2px solid #fff;border-radius:50%}
.cw canvas{max-width:100%;max-height:65vh;display:block;background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0/16px 16px;touch-action:manipulation}
#ring{position:absolute;display:none;border:2px solid #fff;outline:1px solid #000;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
.tl{position:relative;height:72px;border-radius:8px;overflow:hidden;background:#000;touch-action:none;margin:12px 0;user-select:none}
.tl canvas{width:100%;height:100%;display:block}
.sel{position:absolute;top:0;bottom:0;border:3px solid var(--accent);box-shadow:0 0 0 9999px #000a;box-sizing:border-box}
.gh{position:absolute;top:0;bottom:0;width:18px;background:var(--accent);cursor:ew-resize}.gl{left:-3px}.gr{right:-3px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.fl li[draggable]{cursor:grab}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:#0008}
.mb{display:none}
@media(max-width:800px){.mb{display:inline-block}nav{position:fixed;top:55px;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s}nav.open{transform:none}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="btn mb" id="mb" aria-label="Menu">☰</button>
  <h1 id="logo">Project GetNet</h1>
  <span class="sp"></span>
  <button class="btn" id="setb">⚙ Settings</button>
</header>
<div class="wrap"><nav id="nav"></nav><main><div class="in" id="main"></div></main></div>

<dialog id="dlg">
  <h3 style="margin-top:0">Settings</h3>
  <div style="display:grid;gap:12px">
    <label class="f">Theme<select id="s_theme"><option value="system">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <label class="f">Accent colour<input type="color" id="s_acc"></label>
    <label class="f">Image/JPG/WebP quality (10–100)<input type="number" id="s_q" min="10" max="100"></label>
    <label class="f">File name prefix<input type="text" id="s_pre"></label>
  </div>
  <p style="margin:16px 0 0;display:flex;gap:8px"><button class="btn p" id="s_save">Save</button><button class="btn" id="s_reset">Reset</button><button class="btn" id="s_close">Close</button></p>
</dialog>

<script>
const {PDFDocument,rgb,degrees}=PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const DEF={theme:'system',acc:'#0f766e',q:92,pre:'getnet'};
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem('getnet')||'{}')}}catch(e){}
function applyS(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty('--accent',S.acc)}
applyS();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buf=f=>f.arrayBuffer();
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const tb=(c,t)=>new Promise(r=>c.toBlob(r,t,S.q/100));
const LC=new WeakMap(),li=f=>LC.get(f)||(LC.set(f,new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(Error('Cannot read image: '+f.name));i.src=URL.createObjectURL(f)})),LC.get(f));
const bc=async b=>{const i=await li(b),c=cv(i.naturalWidth,i.naturalHeight);c.getContext('2d').drawImage(i,0,0);return c};
const nm=(f,suf)=>S.pre+'_'+f.name.replace(/\.[^.]+$/,'')+suf;
const sv=async(d,name)=>({name,blob:new Blob([await d.save()],{type:'application/pdf'})});
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)),h2=c=>hx(c).map(v=>v/255);
const cl=s=>String(s).replace(/\t/g,'    ').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
const MT={png:'image/png',jpg:'image/jpeg',webp:'image/webp'};
const say=(m,e)=>{const s=$('#st');if(s){s.textContent=m;s.className=e?'err':''}};
function rng(s,n){s=(s||'').trim();if(!s||s=='all')return[...Array(n).keys()];const r=[];s.split(',').forEach(p=>{const[a,b]=p.split('-').map(x=>parseInt(x));if(!a)return;const e=b||a;for(let i=Math.max(a,1);i<=Math.min(e,n);i++)r.push(i-1)});if(!r.length)throw Error('No valid pages in that range');return r}
const FU='https://cdn.jsdelivr.net/npm/dejavu-fonts-ttf@2.37.3/ttf/';let FB=null;
async function fonts(d){const std=async()=>({h:await d.embedFont('Helvetica'),b:await d.embedFont('Helvetica-Bold'),c:await d.embedFont('Courier'),u:0});
 try{if(!window.fontkit)throw 0;if(!FB)FB=await Promise.all(['DejaVuSans','DejaVuSans-Bold','DejaVuSansMono'].map(n=>fetch(FU+n+'.ttf').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})));d.registerFontkit(fontkit);const e=b=>d.embedFont(b,{subset:true});return{h:await e(FB[0]),b:await e(FB[1]),c:await e(FB[2]),u:1}}catch(x){return std()}}
const cx=(F,s)=>F.u?String(s).replace(/\t/g,'    ').replace(/[\u0000-\u0008\u000b-\u001f]/g,''):cl(s);
function md2b(s){const o=[],ic=x=>x.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/(\*\*|__|`)/g,'').replace(/<[^>]+>/g,'');let fe=null;
 for(const l of s.split('\n')){if(/^\s*```/.test(l)){if(fe){o.push({t:fe.join('\n'),f:'c',s:9,bx:[.95,.96,.98],g:5});fe=null}else fe=[];continue}
  if(fe){fe.push(l);continue}const h=l.match(/^(#{1,6})\s+(.*)/);
  if(h)o.push({t:ic(h[2]),s:[22,18,15,13,12,11][h[1].length-1],b:1,g:5});
  else if(l.trim())o.push({t:ic(l.replace(/^(\s*)[-*+]\s+/,'$1• ')),g:2});else o.push({t:'',s:4,g:0})}
 return o}
async function t2p(blocks){const d=await PDFDocument.create(),F=await fonts(d),W=595,H=842,M=50,mx=W-2*M;let p=d.addPage([W,H]),y=H-M;const nl=h=>{if(y-h<M){p=d.addPage([W,H]);y=H-M}};
 for(const b of blocks){
  if(b.img){const e=await d.embedPng(b.img),s=Math.min(1,mx/e.width,320/e.height),w=e.width*s,h=e.height*s;nl(h);p.drawImage(e,{x:M,y:y-h,width:w,height:h});y-=h+8;continue}
  const f=b.f=='c'?F.c:b.b?F.b:F.h,s=b.s||11,ind=(b.i||0)+(b.bx?6:0),w=mx-ind-(b.bx?6:0);
  for(const raw of cx(F,b.t).split('\n')){const ls=[];let ln='';
   if(b.f=='c'){for(const ch of raw){if(f.widthOfTextAtSize(ln+ch,s)>w){ls.push(ln);ln=ch}else ln+=ch}ls.push(ln)}
   else{for(const wd of raw.split(' ')){const t=ln?ln+' '+wd:wd;if(f.widthOfTextAtSize(t,s)>w&&ln){ls.push(ln);ln=wd}else ln=t}ls.push(ln)}
   for(const l of ls){nl(s*1.4);if(b.bx)p.drawRectangle({x:M,y:y-s*1.35,width:mx,height:s*1.4,color:rgb(...b.bx)});p.drawText(l,{x:M+ind,y:y-s,size:s,font:f,color:rgb(...(b.k||[.1,.1,.1]))});y-=s*1.4}}
  y-=b.g??4}
 return d}
const pdfDummy=0;
async function pdfText(file){const pdf=await pdfjsLib.getDocument({data:await buf(file)}).promise;const out=[];for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();let ly=null,t='';tc.items.forEach(it=>{const y=it.transform[5];if(ly!==null&&Math.abs(y-ly)>2)t+='\n';else if(t&&!t.endsWith(' '))t+=' ';t+=it.str;ly=y});out.push(t)}return out}

// option helpers
const tx=(k,l,v='')=>({k,l,t:'text',v}),nu=(k,l,v,min,max)=>({k,l,t:'number',v,min,max}),rg=(k,l,v,min,max)=>({k,l,t:'range',v,min,max}),ck=(k,l,v)=>({k,l,t:'check',v}),co=(k,l,v)=>({k,l,t:'color',v}),se=(k,l,o,v)=>({k,l,t:'select',o,v:v??o[0][0]});
const PDFA='.pdf,application/pdf',IMG='image/*';
const FMT=[['png','PNG'],['jpg','JPG'],['webp','WebP']];

const VT=[['webm','video/webm;codecs=vp9,opus'],['webm','video/webm;codecs=vp8,opus'],['webm','video/webm'],['mp4','video/mp4;codecs=avc1,mp4a.40.2'],['mp4','video/mp4']];
const VFS=()=>{const a=[];if(typeof MediaRecorder=='undefined')return[['webm','WebM','video/webm']];['webm','mp4'].forEach(e=>{const m=VT.filter(x=>x[0]==e).map(x=>x[1]).find(t=>MediaRecorder.isTypeSupported(t));if(m)a.push([e,e.toUpperCase(),m])});return a.length?a:[['webm','WebM','video/webm']]};
const vfOpt=()=>se('fm','Output format',VFS().map(x=>[x[0],x[1]]));
const T=[
{id:'split',g:'PDF',i:'✂️',n:'Extract / split pages',d:'Pull out pages or split into single pages',acc:PDFA,o:[tx('r','Pages (e.g. 1-3,5,8)','1'),se('m','Mode',[['one','One PDF with these pages'],['each','Separate PDF per page']])],
 async run(f,o){const src=await PDFDocument.load(await buf(f[0])),idx=rng(o.r,src.getPageCount());
  if(o.m=='each')return Promise.all(idx.map(async i=>{const d=await PDFDocument.create();d.addPage((await d.copyPages(src,[i]))[0]);return sv(d,nm(f[0],'_p'+(i+1)+'.pdf'))}));
  const d=await PDFDocument.create();(await d.copyPages(src,idx)).forEach(p=>d.addPage(p));return[await sv(d,nm(f[0],'_extract.pdf'))]}},
{id:'merge',g:'PDF',i:'🧩',n:'Merge PDFs',d:'Combine 2 or more PDFs (use ↑ to reorder)',acc:PDFA,multi:1,o:[],
 async run(f){if(f.length<2)throw Error('Add at least 2 PDFs');const d=await PDFDocument.create();for(const x of f){const s=await PDFDocument.load(await buf(x));(await d.copyPages(s,s.getPageIndices())).forEach(p=>d.addPage(p))}return[await sv(d,S.pre+'_merged.pdf')]}},
{id:'organize',g:'PDF',i:'🔄',n:'Rotate / delete pages',d:'Fix orientation or remove pages',acc:PDFA,o:[se('a','Action',[['rot','Rotate'],['del','Delete']]),tx('r','Pages (blank = all)',''),se('g','Rotate by',[['90','90° clockwise'],['180','180°'],['270','90° counter-clockwise']])],
 async run(f,o){const d=await PDFDocument.load(await buf(f[0])),idx=rng(o.r,d.getPageCount());
  if(o.a=='del'){if(idx.length>=d.getPageCount())throw Error('Cannot delete every page');[...idx].sort((a,b)=>b-a).forEach(i=>d.removePage(i))}
  else idx.forEach(i=>{const p=d.getPage(i);p.setRotation(degrees((p.getRotation().angle+ +o.g)%360))});
  return[await sv(d,nm(f[0],'_edited.pdf'))]}},
{id:'editpdf',g:'PDF',i:'✏️',n:'Edit PDF',d:'Open a PDF, click text to change it, add text, images, highlights or white-out',acc:PDFA,custom:1,o:[],async run(){}},
{id:'pdf2img',g:'PDF',i:'🖼️',n:'PDF to images',d:'Turn each page into PNG, JPG or WebP',acc:PDFA,o:[tx('r','Pages (blank = all)',''),se('f','Format',FMT),nu('sc','Resolution scale',2,1,4)],
 async run(f,o){const pdf=await pdfjsLib.getDocument({data:await buf(f[0])}).promise,out=[];for(const i of rng(o.r,pdf.numPages)){say('Rendering page '+(i+1)+'…');const p=await pdf.getPage(i+1),v=p.getViewport({scale:o.sc}),c=cv(v.width,v.height),g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await p.render({canvasContext:g,viewport:v}).promise;out.push({name:nm(f[0],'_p'+(i+1)+'.'+o.f),blob:await tb(c,MT[o.f])})}return out}},
{id:'img2pdf',g:'Convert',i:'📄',n:'Images to PDF',d:'One page per image, in the order listed',acc:IMG,multi:1,o:[],
 async run(f){const d=await PDFDocument.create();for(const x of f){const i=await li(x),c=cv(i.naturalWidth,i.naturalHeight);c.getContext('2d').drawImage(i,0,0);const e=await d.embedPng(await buf(await tb(c,'image/png'))),s=Math.min(1,595/e.width);d.addPage([e.width*s,e.height*s]).drawImage(e,{x:0,y:0,width:e.width*s,height:e.height*s})}return[await sv(d,S.pre+'_images.pdf')]}},
{id:'ipynb2pdf',g:'Convert',i:'📓',n:'.ipynb to PDF',d:'Clean notebook PDF: formatted text, shaded code cells, outputs and plots',acc:'.ipynb',o:[],
 async run(f){const nb=JSON.parse(await f[0].text()),b=[],an=s=>String(s).replace(/\x1b\[[0-9;]*[A-Za-z]/g,'').replace(/\r/g,''),j=s=>[].concat(s||[]).join('');
  (nb.cells||[]).forEach(c=>{const s=j(c.source);if(c.cell_type=='markdown')b.push(...md2b(s));else if(c.cell_type=='code'){b.push({t:'In ['+(c.execution_count??' ')+']:',s:8,k:[.45,.45,.5],g:1},{t:s.replace(/\s+$/,''),f:'c',s:9,bx:[.95,.96,.98],g:5});
   (c.outputs||[]).forEach(u=>{const d=u.data||{};if(d['image/png'])b.push({img:Uint8Array.from(atob(j(d['image/png']).replace(/\s/g,'')),ch=>ch.charCodeAt(0))});else{const t=u.output_type=='error'?j(u.traceback):j(u.text||d['text/plain']);if(t.trim())b.push({t:an(t).replace(/\s+$/,''),f:'c',s:8,i:10,g:6,k:u.output_type=='error'?[.7,.1,.1]:[.2,.2,.2]})}})}});
  return[await sv(await t2p(b),nm(f[0],'.pdf'))]}},
{id:'pdf2ipynb',g:'Convert',i:'📔',n:'PDF to .ipynb',d:'Each page becomes a markdown cell (text only)',acc:PDFA,o:[],

   r.forEach(x=>{const u=URL.createObjectURL(x.blob);urls.push(u);const d=document.createElement('div'),ty=x.blob.type;d.innerHTML=(ty.startsWith('image/')&&!auto?`<img src="${u}" alt="">`:ty.startsWith('video/')?`<video src="${u}" controls></video>`:'')+`<span>${esc(x.name)} <small class="mu">${(x.blob.size/1024).toFixed(0)} KB</small></span><a class="btn p" href="${u}" download="${esc(x.name)}">Download</a>`;$('#res').appendChild(d)});if(auto)$('#res a').click();
   say(r.length+' file'+(r.length>1?'s':'')+' ready.')}
  catch(e){say('Error: '+e.message,1);console.error(e)}
  busy=0;if(b)b.disabled=false}
function route(){const id=location.hash.replace('#/','');[...nav.querySelectorAll('a')].forEach(a=>a.classList.toggle('on',a.dataset.id==id));const t=T.find(x=>x.id==id);t?tool(t):home()}
// settings
const dlg=$('#dlg');
$('#setb').onclick=()=>{$('#s_theme').value=S.theme;$('#s_acc').value=S.acc;$('#s_q').value=S.q;$('#s_pre').value=S.pre;dlg.showModal()};
$('#s_close').onclick=()=>dlg.close();
$('#s_reset').onclick=()=>{S={...DEF};store();applyS();dlg.close()};
$('#s_save').onclick=()=>{S={theme:$('#s_theme').value,acc:$('#s_acc').value,q:Math.min(100,Math.max(10,+$('#s_q').value||92)),pre:($('#s_pre').value||'getnet').replace(/[^\w-]/g,'_')};store();applyS();dlg.close()};
function store(){try{localStorage.setItem('getnet',JSON.stringify(S))}catch(e){}}
buildNav();window.onhashchange=route;route();
</script>
</body>
